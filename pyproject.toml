[project]
name = "case-spine"
version = "0.1.0"
description = "One case ledger, six lenses. A reference build for unified analysis-pipeline telemetry."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "anyio>=4.0", "pytest-anyio", "mcp>=2.0", "pytest-playwright>=0.5"]
# Not installed locally: the production path runs the same SQL through Dagster
# against Redshift. Kept separate so `pip install -e .` stays fast.
prod = ["dagster>=1.7", "dagster-webserver>=1.7", "redshift-connector>=2.1"]

[project.scripts]
spine-generate = "spine.generate:main"
spine-build = "spine.build:main"
spine-serve = "app.main:dev"
case-spine-mcp = "mcp_server.server:mcp.run"

[tool.setuptools]
packages = ["spine", "app", "orchestration", "mcp_server"]

[tool.pytest.ini_options]
# The browser suite is excluded by default and run as its own job.
#
# This is not a workaround for a flaky test - Playwright's sync API drives a
# greenlet-backed event loop that cannot coexist in-process with the anyio async
# tests the MCP suite needs. Separating them is also what you want operationally:
# the fast suite (38 tests, ~4s) gates every commit, the browser suite (17 tests,
# ~25s, needs a Chromium download) runs as its own CI job.
#
#   pytest                 -> unit, contract, guardrail, MCP
#   pytest tests/e2e       -> browser
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "allow_console_errors: test deliberately provokes browser errors",
]
